# Custom ByteTrack configuration without Global Motion Compensation (GMC)
# This prevents "WARNING not enough matching points" output on low-feature camera streams.

tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 45
match_thresh: 0.8
fuse_score: True
gmc_method: none
